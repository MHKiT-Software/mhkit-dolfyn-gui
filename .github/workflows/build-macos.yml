name: Build macOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Prepare version info
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.info.outputs.app_name }}
      tag_name: ${{ steps.info.outputs.tag_name }}
      release_name: ${{ steps.info.outputs.release_name }}
      is_release: ${{ steps.info.outputs.is_release }}
      is_prerelease: ${{ steps.info.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Get release info
        id: info
        run: |
          python3 scripts/release_info.py \
            --ref "${{ github.ref }}" \
            --event "${{ github.event_name }}" \
            --run "${{ github.run_number }}" >> $GITHUB_OUTPUT

  # Build macOS - Apple Silicon and Intel
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch_label: AppleSilicon
          - os: macos-15-intel
            arch_label: Intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          activate-environment: mhkit-dolfyn-gui

      - name: Create conda environment
        shell: bash -el {0}
        run: |
          conda env create -f environment.yml

      - name: Install dev dependencies
        shell: bash -el {0}
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        shell: bash -el {0}
        run: |
          pytest -k "not TestBundledApp" -v

      - name: Build application
        shell: bash -el {0}
        run: |
          rm -rf build dist
          pyinstaller mhkit_dolfyn_gui.spec

      - name: Create archive
        shell: bash -el {0}
        env:
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
        run: |
          cd dist
          zip -r "${APP_NAME}-macOS-${{ matrix.arch_label }}.zip" "${APP_NAME}.app"

      - name: Upload artifact (CI builds only)
        if: needs.prepare.outputs.is_release != 'true' && needs.prepare.outputs.is_prerelease != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macOS-${{ matrix.arch_label }}
          path: dist/${{ needs.prepare.outputs.app_name }}-macOS-${{ matrix.arch_label }}.zip
          retention-days: 3

      - name: Upload to GitHub Release
        if: needs.prepare.outputs.is_release == 'true' || needs.prepare.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          files: dist/${{ needs.prepare.outputs.app_name }}-macOS-${{ matrix.arch_label }}.zip