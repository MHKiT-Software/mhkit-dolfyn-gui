name: Build Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Prepare version info
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.info.outputs.app_name }}
      tag_name: ${{ steps.info.outputs.tag_name }}
      release_name: ${{ steps.info.outputs.release_name }}
      is_release: ${{ steps.info.outputs.is_release }}
      is_prerelease: ${{ steps.info.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Get release info
        id: info
        run: |
          python3 scripts/release_info.py \
            --ref "${{ github.ref }}" \
            --event "${{ github.event_name }}" \
            --run "${{ github.run_number }}" >> $GITHUB_OUTPUT

  # Build Windows
  build:
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          activate-environment: mhkit-dolfyn-gui

      - name: Create conda environment
        shell: bash -el {0}
        run: |
          conda env create -f environment.yml

      - name: Install dev dependencies
        shell: bash -el {0}
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        shell: bash -el {0}
        run: |
          pytest -k "not TestBundledApp" -v

      - name: Build application
        shell: bash -el {0}
        env:
          PYINSTALLER_ONEFILE: "true"
        run: |
          rm -rf build dist
          pyinstaller mhkit_dolfyn_gui.spec

      # Launch-and-kill smoke test: start the app, wait for it to stabilise,
      # check it is still alive (didn't crash on startup), then kill it.
      # Uses PowerShell Start-Process -PassThru for reliable Windows process tracking.
      # kill -0 / tasklist in Git Bash are not reliable for checking Windows GUI processes.
      - name: Smoke test bundled app
        shell: pwsh
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $proc = Start-Process -FilePath "dist\MHKiT-DOLFyN.exe" -PassThru
          # ONEFILE builds unpack to a temp folder before Python starts.
          # Allow 60s: ~20-30s to unpack, ~15-20s for Qt/mhkit imports to initialise.
          Start-Sleep -Seconds 60
          if ($proc.HasExited) {
            Write-Error "Smoke test FAILED: app exited early with code $($proc.ExitCode)"
            exit 1
          } else {
            $proc.Kill()
            Write-Output "Smoke test passed: app was still running after 20s"
          }

      # Legacy headless smoke test (kept for reference, currently disabled)
      # - name: Smoke test bundled app (headless)
      #   shell: bash -el {0}
      #   env:
      #     QT_QPA_PLATFORM: offscreen
      #   run: |
      #     "dist/MHKiT-DOLFyN/MHKiT-DOLFyN.exe" --smoke-test

      - name: Rename executable (release builds)
        if: needs.prepare.outputs.is_release == 'true' || needs.prepare.outputs.is_prerelease == 'true'
        shell: bash -el {0}
        run: |
          mv "dist/MHKiT-DOLFyN.exe" "dist/MHKiT-DOLFyN-Windows.exe"

      - name: Upload artifact (CI builds only)
        if: needs.prepare.outputs.is_release != 'true' && needs.prepare.outputs.is_prerelease != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MHKiT-DOLFyN-Windows
          path: dist/MHKiT-DOLFyN.exe
          retention-days: 3

      - name: Upload to GitHub Release
        if: needs.prepare.outputs.is_release == 'true' || needs.prepare.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          files: dist/MHKiT-DOLFyN-Windows.exe