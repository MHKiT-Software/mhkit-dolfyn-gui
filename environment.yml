name: mhkit-dolfyn-gui
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0
  - libnetcdf
  - netcdf4
  - hdf5
  - pyyaml
  - psutil
  # Ensure Qt DLLs share conda-forge's
  # build of openssl/icu/zlib with libnetcdf/hdf5/netcdf4
  - pyside6>=6.6.0,<6.11
  - pip
  # Intentionally install mhkit from pip
  - pip:
      - mhkit>=1.1.1
